<!DOCTYPE html>
<head>
    <meta charset="utf-8"/>
    <meta property="og:url" content="{{ current_url | safe}}">
    <meta property="og:type" content="blog" />
    <meta property="og:site_name" content="furtidev" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% block pagetitle %}<title>furtidev</title>{% endblock pagetitle %}
    <link rel="stylesheet" href="{{ get_url(path='site.css', trailing_slash=false, cachebust=true) | safe }}">
    <link rel="stylesheet" href="{{ get_url(path='fontello.css', trailing_slash=false, cachebust=true) | safe }}">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel='preload' href='/images/text.png' type='image/png' fetchpriority='high'>
    <meta property="og:image" content="/android-chrome-512x512.png">
    <meta property="og:image:type" content="image/png">
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5bbad5">
    <meta name="msapplication-TileColor" content="#da532c">
    <!-- <meta name="theme-color" content="#392945"> -->
</head>

<body>
<a class="skip-to-main" href="#main-content">Skip to main content</a>
<!-- <br>
<script src="https://keepandroidopen.org/banner.js?size=minimal&hidebutton=off&animation=off"></script> -->

<header>
    <div>
        <img src="/images/logo.png" width="40%" alt="Stylized wordmark with a barcode and text that reads 'furti'.">
    </div>

    <ul class="social-medias">
        <li>
            <a href="https://github.com/furtidev" target="_blank"><img src="/images/github.png" style="image-rendering: pixelated; width: 64px" alt="GitHub logo"></a>
        </li>
        <li>
            <a href="https://bsky.app/profile/furtidev.github.io" target="_blank"><img src="/images/bluesky.png" style="image-rendering: pixelated; width: 64px" class="bluesky" alt="BlueSky logo"></a>
        </li>
    </ul>
</header>

<nav>
    <ul>
        <li><a href="/" class="styled yellow">home</a></li>
        <li><a href="{{ get_url(path='@/blog/_index.md') }}" class="styled magenta">blog</a></li>
        <li><a href="{{ get_url(path='rss.xml', trailing_slash=false) }}" class="styled orange">rss</a></li>
    </ul>
</nav>

<main id="main-content">
{% block content %} {% endblock content %}

</main>

<footer class="main-footer">
    <p>© 2023–2026 furtidev. <a href="{{ get_url(path='@/meta/_index.md') }}">Some rights reserved</a></p>

    <p>Built on {{ now() | date(format="%d %B, %Y %r %:z") }}.</p>

    <img src="/images/island.gif" width="20%" alt="A rotating low-poly 3D model of a beach">
</footer>
</body>
